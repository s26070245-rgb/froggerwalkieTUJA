<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐔 emoji chicken · slow & simple</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #1f3b1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 12px;
        }
        /* ultra-flat container – no nested borders, minimal chrome */
        .game-area {
            background: #1f3b1f;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 680px;
            width: 100%;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #2a6b2a;
            width: 100%;
            height: auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            touch-action: none;
        }
        /* single flat row for score + restart */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
            color: #e9f5d0;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 2px 2px 0 #0a1f0a;
        }
        .score {
            background: #0d2b0d;
            padding: 4px 18px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: inset 0 -2px 0 #4a7a4a;
        }
        .restart {
            background: #e7b42e;
            border: none;
            font-size: 1.3rem;
            padding: 4px 18px 6px;
            border-radius: 40px;
            font-weight: 800;
            color: #1e2a0e;
            box-shadow: 0 4px 0 #8f6f1a;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.05s linear;
            transform: translateY(-1px);
        }
        .restart:active {
            box-shadow: 0 1px 0 #8f6f1a;
            transform: translateY(3px);
        }
        .hint {
            text-align: center;
            margin-top: 8px;
            color: #b8d9a4;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="game-area">
    <!-- single row – no nested divs beyond this -->
    <div class="top-bar">
        <span class="score">🏆 <span id="scoreDisplay">0</span></span>
        <button class="restart" id="restartButton">↻ RESTART</button>
    </div>
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div class="hint">🐔 arrow keys / swipe · slow cars · reach 🏁</div>
</div>
<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');

        // ---------- grid ----------
        const COLS = 8;
        const ROWS = 9;
        const CELL_W = canvas.width / COLS;   // 80
        const CELL_H = canvas.height / ROWS;  // 53.333

        // ---------- state ----------
        let score = 0;
        let chicken = { col: 3, row: 0 };  // bottom row 0

        // cars: smooth fractional column, slower speeds
        let cars = [];

        const carEmojis = ['🚗', '🚙', '🚕', '🚌', '🚚', '🚓'];

        // ---------- initialize cars – significantly slower ----------
        function resetCars() {
            cars = [];
            const roadRows = [2, 3, 4, 5, 6];
            roadRows.forEach(row => {
                // 2 or 3 cars per row
                const carCount = (row % 2 === 0) ? 3 : 2;
                // alternate direction per row
                const dir = (row % 2 === 0) ? 1 : -1;
                for (let i = 0; i < carCount; i++) {
                    const col = (i * 3 + row * 2) % COLS;
                    const emoji = carEmojis[Math.floor(Math.random() * carEmojis.length)];
                    // *** SLOWER SPEED: 0.008 – 0.018 cells/frame ***
                    const speed = 0.008 + Math.random() * 0.010;
                    cars.push({
                        fCol: col,          // fractional column for smooth movement
                        row: row,
                        dir: dir,
                        emoji: emoji,
                        speed: speed
                    });
                }
            });
        }

        // ---------- reset game (score + chicken + cars) ----------
        function resetGame() {
            chicken = { col: 3, row: 0 };
            score = 0;
            updateScore();
            resetCars();
        }

        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ---------- collision: chicken vs any car (rounded column) ----------
        function checkCollision() {
            for (let car of cars) {
                const carCol = Math.round(car.fCol);
                // wrap column into 0..COLS-1 for fair check
                const wrappedCol = ((carCol % COLS) + COLS) % COLS;
                if (car.row === chicken.row && wrappedCol === chicken.col) {
                    return true;
                }
            }
            return false;
        }

        // ---------- move chicken ----------
        function moveChicken(direction) {
            let newCol = chicken.col;
            let newRow = chicken.row;

            if (direction === 'up') newRow = Math.min(chicken.row + 1, ROWS - 1);
            if (direction === 'down') newRow = Math.max(chicken.row - 1, 0);
            if (direction === 'left') newCol = Math.max(chicken.col - 1, 0);
            if (direction === 'right') newCol = Math.min(chicken.col + 1, COLS - 1);

            if (newCol === chicken.col && newRow === chicken.row) return;

            const oldCol = chicken.col, oldRow = chicken.row;
            chicken.col = newCol;
            chicken.row = newRow;

            // immediate collision check after tentative move
            if (checkCollision()) {
                chicken.col = oldCol;
                chicken.row = oldRow;
                return;
            }

            // win condition: reach top row (row 8)
            if (chicken.row === ROWS - 1) {
                score++;
                updateScore();
                // respawn chicken at start
                chicken.col = 3;
                chicken.row = 0;
                // fresh cars so no immediate unfair hit
                resetCars();
            }
        }

        // ---------- update car positions ----------
        function updateCars() {
            for (let car of cars) {
                car.fCol += car.dir * car.speed;

                // wrap around with margin
                if (car.fCol > COLS + 0.5) {
                    car.fCol = -1.0;
                } else if (car.fCol < -1.0) {
                    car.fCol = COLS + 0.5;
                }
            }
        }

        // ---------- collision after car movement ----------
        function checkCollisionAfterMove() {
            for (let car of cars) {
                const carCol = Math.round(car.fCol);
                const wrappedCol = ((carCol % COLS) + COLS) % COLS;
                if (car.row === chicken.row && wrappedCol === chicken.col) {
                    // hit → reset chicken to start
                    chicken.col = 3;
                    chicken.row = 0;
                    // reset cars to avoid instant repeat
                    resetCars();
                    break;
                }
            }
        }

        // ---------- draw everything (clean, no extra decorations) ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ----- background rows -----
            for (let row = 0; row < ROWS; row++) {
                const y = canvas.height - (row + 1) * CELL_H;
                let fillColor = '#2e7d32';

                if (row === 0) fillColor = '#4caf50';        // start grass
                else if (row === 1) fillColor = '#388e3c';   // safe grass
                else if (row >= 2 && row <= 6) fillColor = '#2c3e50'; // road
                else if (row === 7) fillColor = '#388e3c';   // safe grass
                else if (row === 8) fillColor = '#b8860b';   // goal

                ctx.fillStyle = fillColor;
                ctx.fillRect(0, y, canvas.width, CELL_H);

                // road lane markings
                if (row >= 2 && row <= 6) {
                    ctx.fillStyle = '#f1c40f';
                    const dashY = y + CELL_H * 0.5;
                    for (let col = 0; col < COLS; col++) {
                        const dashX = col * CELL_W + CELL_W * 0.25;
                        ctx.fillRect(dashX, dashY - 2, CELL_W * 0.5, 4);
                    }
                }

                // subtle grid lines
                ctx.strokeStyle = '#00000022';
                ctx.lineWidth = 1;
                for (let col = 0; col <= COLS; col++) {
                    ctx.beginPath();
                    ctx.moveTo(col * CELL_W, y);
                    ctx.lineTo(col * CELL_W, y + CELL_H);
                    ctx.stroke();
                }
            }

            // ----- goal row checkered pattern + flag -----
            const goalY = canvas.height - (8 + 1) * CELL_H;
            for (let col = 0; col < COLS; col++) {
                ctx.fillStyle = (col % 2 === 0) ? '#f5e6b0' : '#d4af37';
                ctx.fillRect(col * CELL_W, goalY, CELL_W, CELL_H);
                ctx.font = `${CELL_H * 0.5}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#00000055';
                ctx.fillText('🏁', col * CELL_W + CELL_W/2, goalY + CELL_H/2 + 2);
                ctx.fillStyle = '#ffffffdd';
                ctx.fillText('🏁', col * CELL_W + CELL_W/2, goalY + CELL_H/2);
            }

            // ----- draw cars (smooth position) -----
            cars.forEach(car => {
                let displayCol = car.fCol;
                // wrap for drawing
                if (displayCol > COLS) displayCol -= COLS;
                if (displayCol < -0.5) displayCol += COLS;

                const x = displayCol * CELL_W + CELL_W / 2;
                const y = canvas.height - (car.row + 1) * CELL_H + CELL_H / 2;

                // simple shadow for depth
                ctx.shadowColor = '#00000080';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.font = `${CELL_H * 0.8}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(car.emoji, x, y);
                // reset shadow
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            });

            // ----- draw chicken with soft glow -----
            const chickenX = chicken.col * CELL_W + CELL_W / 2;
            const chickenY = canvas.height - (chicken.row + 1) * CELL_H + CELL_H / 2;

            ctx.shadowColor = '#fff9c4';
            ctx.shadowBlur = 16;
            ctx.font = `${CELL_H * 0.9}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';
            ctx.fillText('🐔', chickenX, chickenY);
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        // ---------- game loop ----------
        function gameLoop() {
            updateCars();
            checkCollisionAfterMove();  // chicken may be hit
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- keyboard ----------
        function handleKey(e) {
            const key = e.key;
            if (key.startsWith('Arrow')) e.preventDefault();
            if (key === 'ArrowUp') moveChicken('up');
            else if (key === 'ArrowDown') moveChicken('down');
            else if (key === 'ArrowLeft') moveChicken('left');
            else if (key === 'ArrowRight') moveChicken('right');
        }

        // ---------- touch swipe (simple) ----------
        let touchStartX = 0, touchStartY = 0;
        let touchMoved = false;

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (touchMoved) return;
            if (e.touches.length === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < 18) return;

            touchMoved = true;
            if (absDx > absDy) {
                if (dx > 0) moveChicken('right');
                else moveChicken('left');
            } else {
                if (dy > 0) moveChicken('down');
                else moveChicken('up');
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            touchMoved = false;
        }

        // ---------- restart button ----------
        document.getElementById('restartButton').addEventListener('click', () => {
            resetGame();
            draw();
        });

        // ---------- attach listeners ----------
        window.addEventListener('keydown', handleKey);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd);
        canvas.addEventListener('touchcancel', handleTouchEnd);

        // ---------- init ----------
        resetGame();
        draw();
        gameLoop();
    })();
</script>
</body>
</html>
